# POLKORP AI — free-tier stack (Oracle Cloud Always Free, ARM64, CPU only)
#
# Differs from docker-compose.yml (the full GPU spec):
#   - no NVIDIA device reservations (this host has no GPU)
#   - no `fooocus` service — nvidia/cuda base image doesn't run on ARM64,
#     and there's no GPU here anyway; Fooocus stays on Kaggle for this setup
#   - no `lama` service — installed via pipx directly on the host instead
#     (see deploy-vps-free.sh), sidestepping uncertain ARM64 support in the
#     cwq1913/lama-cleaner image
#   - ollama's official image is multi-arch and runs fine CPU-only on ARM64

services:
  dashboard:
    image: nginx:alpine
    container_name: polkorp-dashboard
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
    networks:
      - polkorp-net
    depends_on:
      - backend

  # Real FastAPI backend — see backend/app.py. Defines the platform's
  # agents (Code, Terminal Chat live via Ollama; Image/Restoration/
  # Upscaling/OSINT respond honestly that they need tools not on this box).
  backend:
    image: python:3.11-slim
    container_name: polkorp-backend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "5050:5050"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=huihui_ai/qwen2.5-abliterate:0.5b
    command: >
      sh -c "pip install --quiet --no-cache-dir -r requirements.txt
      && uvicorn app:app --host 0.0.0.0 --port 5050"
    depends_on:
      - ollama
    networks:
      - polkorp-net

  ollama:
    image: ollama/ollama
    container_name: polkorp-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - polkorp-net
    # No GPU block: runs CPU-only. On a 12GB+ Ampere A1 free-tier shape,
    # 8B-class models (llama3.1:8b, mistral) run fine even at q4. On the
    # 1GB E2.1.Micro shape (what most people actually get approved for),
    # an 8B model shows up as "pulled" but OOM-crashes on every request —
    # ollama pull succeeds, ollama serve does not. Use qwen2.5:0.5b there;
    # it's the OLLAMA_MODEL default below for exactly this reason.

networks:
  polkorp-net:
    driver: bridge

volumes:
  ollama-data:
